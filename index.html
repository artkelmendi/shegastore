<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta property="og:site_name" content="Wolf Shop" />
    <meta property="og:title" content="Wolf Shop | Wear your own statement." />
    <link rel="canonical" href="https://wolfshop.style/" />
    <meta name="theme-color" content="#fbfbfa" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("wolf-theme") === "dark" ? "dark" : "light";
      } catch {}
      if (
        !/(?:^|\/)(?:login|admin|account)(?:\/|$)/.test(location.pathname) &&
        new URLSearchParams(location.search).get("entrance") !== "classic"
      )
        document.documentElement.dataset.originExperiment = "pending";
    </script>
    <style>
      html[data-origin-experiment="pending"],
      html[data-origin-experiment="pending"] body {
        background: #fff !important;
      }
      html[data-origin-experiment="pending"] .site-shell {
        visibility: hidden;
      }
    </style>
    <meta
      name="description"
      content="Explore Wolf Shop’s replica menswear catalog. Check colours and listed sizes, then confirm availability and final prices with @wolfshop.ks on Instagram."
    />
    <link rel="icon" type="image/svg+xml" href="/logos/wolf-ticket-red.svg" />
    <link
      rel="preload"
      href="/fonts/cabinet-grotesk-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/logos/wolf-full-light.svg"
      as="image"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/satoshi-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/images/real/wolf-boss-hero.webp"
      as="image"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/satoshi-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Wolf Shop | Wear your own statement.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
